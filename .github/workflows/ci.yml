name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Python tools for the generated backend (v0.5)
        run: pnpm pyenv

      - name: Oracle self-test (reference/test_canon.py)
        working-directory: reference
        run: python3 test_canon.py

      - name: Conformance expectations are up to date
        run: |
          pnpm oracle
          git diff --exit-code tests/conformance

      - name: Build packages
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Test
        run: pnpm test:fast

      - name: Web build
        run: pnpm --filter web build

      - name: Playwright smoke test
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm e2e

      - name: Example apps end to end (v0.5)
        run: pnpm e2e:examples
